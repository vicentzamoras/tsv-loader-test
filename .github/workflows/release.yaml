name: Release plugin

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # crear la release y subir el .zip
  id-token: write      # identidad del workflow para firmar con Sigstore
  attestations: write  # guardar la attestation en GitHub

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin zip
        run: zip "tsv-loader-${GITHUB_REF_NAME}.zip" manifest.json tsv_dataloader.py

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: tsv-loader-${{ github.ref_name }}.zip

      - name: Create release or upload to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "tsv-loader-${GITHUB_REF_NAME}.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "tsv-loader-${GITHUB_REF_NAME}.zip" \
              --title "$GITHUB_REF_NAME" --notes "Plugin release"
          fi
